<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 160" fill="none">
  <defs>
    <linearGradient id="washi-base" x1="40" y1="3" x2="40" y2="151" gradientUnits="userSpaceOnUse">
      <stop stop-color="#629B92"/>
      <stop offset="0.5" stop-color="#4D8981"/>
      <stop offset="1" stop-color="#3B7771"/>
    </linearGradient>
    <filter id="washi-shadow" x="-18%" y="-10%" width="140%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0.5" dy="1.8" stdDeviation="1.3" flood-color="#274943" flood-opacity="0.18"/>
    </filter>
    <filter id="washi-fibers" x="-12%" y="-8%" width="124%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.095" numOctaves="4" seed="11" result="paper"/>
      <feColorMatrix in="paper" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft-paper">
        <feFuncR type="linear" slope="1.2" intercept="-0.1"/>
        <feFuncG type="linear" slope="1.2" intercept="-0.1"/>
        <feFuncB type="linear" slope="1.2" intercept="-0.1"/>
        <feFuncA type="table" tableValues="0 0.3"/>
      </feComponentTransfer>
      <feComposite in="soft-paper" in2="SourceAlpha" operator="in" result="masked-paper"/>
      <feBlend in="SourceGraphic" in2="masked-paper" mode="soft-light"/>
    </filter>
    <path id="washi-shape" d="M4 3H76V151L40 128L4 151V3Z"/>
  </defs>
  <g filter="url(#washi-shadow)">
    <use href="#washi-shape" fill="url(#washi-base)" filter="url(#washi-fibers)"/>
    <use href="#washi-shape" stroke="#2C6A64" stroke-opacity="0.22" stroke-width="0.8"/>
  </g>
</svg>
